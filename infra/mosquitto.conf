# 엣지(MIC-711D) MQTT 브로커 설정. 맥 개발·검사는 같은 포트의 aedes(infra/broker.mjs)를 쓴다(ADR 0004).
#   mosquitto -c infra/mosquitto.conf
# 서버·도구는 TCP 1883, 브라우저(트윈·관제 화면)는 웹소켓 9001.

per_listener_settings false
persistence true
persistence_location /var/lib/mosquitto/

listener 1883
protocol mqtt

listener 9001
protocol websockets

# 현장 LAN 안에서만 쓴다. 인증·TLS는 서버 단계에서 정한다(contracts/docs/README.md).
allow_anonymous true

# retained 상태(task/state, task/proposal, status)를 브로커 재시작 뒤에도 유지한다
autosave_interval 60
