[project]
name = "welding-server"
version = "0.1.0"
description = "용접 관제 엣지 서버(MIC-711D): 작업 상태 머신, 카메라, 경로 수렴, 안전, 저장, 어댑터, Mock"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "paho-mqtt>=2.1",
  "jsonschema>=4.23",
  "numpy>=2.2",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["../tests/server"]
pythonpath = [".", "../tests/server"]
